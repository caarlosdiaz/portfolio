<svg viewBox="0 0 840 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <g transform="translate(40,40)">
  <rect x="0" y="0" width="760" height="560" rx="16" fill="#F7F8FA"/>

  <!-- Title -->
  <text x="60" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1B2430">Retrieval quality vs. response time</text>
  <text x="60" y="68" font-size="12.5" fill="#5B6472">Validation set, nDCG@10 &#183; response time in milliseconds, log scale</text>

  <!-- Plot area border -->
  <line x1="110" y1="110" x2="110" y2="430" stroke="#1B2430" stroke-width="1.3"/>
  <line x1="110" y1="430" x2="670" y2="430" stroke="#1B2430" stroke-width="1.3"/>

  <!-- Y gridlines + labels -->
  <g font-size="11" fill="#8A93A3">
    <line x1="110" y1="110" x2="670" y2="110" stroke="#E2E5EA" stroke-width="1"/>
    <text x="98" y="114" text-anchor="end">0.60</text>
    <line x1="110" y1="174" x2="670" y2="174" stroke="#E2E5EA" stroke-width="1"/>
    <text x="98" y="178" text-anchor="end">0.55</text>
    <line x1="110" y1="238" x2="670" y2="238" stroke="#E2E5EA" stroke-width="1"/>
    <text x="98" y="242" text-anchor="end">0.50</text>
    <line x1="110" y1="302" x2="670" y2="302" stroke="#E2E5EA" stroke-width="1"/>
    <text x="98" y="306" text-anchor="end">0.45</text>
    <line x1="110" y1="366" x2="670" y2="366" stroke="#E2E5EA" stroke-width="1"/>
    <text x="98" y="370" text-anchor="end">0.40</text>
    <text x="98" y="434" text-anchor="end">0.35</text>
  </g>

  <!-- X gridlines + labels (log scale: 10, 100, 1000 ms) -->
  <g font-size="11" fill="#8A93A3">
    <line x1="110" y1="110" x2="110" y2="430" stroke="#E2E5EA" stroke-width="1"/>
    <text x="110" y="450" text-anchor="middle">10 ms</text>
    <line x1="390" y1="110" x2="390" y2="430" stroke="#E2E5EA" stroke-width="1"/>
    <text x="390" y="450" text-anchor="middle">100 ms</text>
    <line x1="670" y1="110" x2="670" y2="430" stroke="#E2E5EA" stroke-width="1"/>
    <text x="670" y="450" text-anchor="middle">1 s</text>
  </g>

  <!-- Axis titles -->
  <text x="390" y="480" text-anchor="middle" font-size="12.5" fill="#1B2430" font-weight="600">Response time per query (log scale)</text>
  <text x="34" y="270" text-anchor="middle" font-size="12.5" fill="#1B2430" font-weight="600" transform="rotate(-90 34 270)">nDCG@10</text>

  <!-- Efficient frontier: BM25 -> BiEnc@100 -> CE@100 -->
  <path d="M191 301 L 325 171 L 452 138" stroke="#1B2430" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
  <text x="250" y="230" font-size="10.5" fill="#5B6472" font-style="italic" transform="rotate(-27 250 230)">efficient frontier</text>

  <!-- LM (baseline, gray) -->
  <circle cx="193" cy="369" r="7" fill="#94A3B8"/>
  <text x="193" y="392" text-anchor="middle" font-size="10.5" fill="#5B6472">LM</text>

  <!-- BM25 (baseline, on frontier) -->
  <circle cx="191" cy="301" r="7.5" fill="#1B2430"/>
  <text x="191" y="286" text-anchor="middle" font-size="11" fill="#1B2430" font-weight="600">BM25</text>

  <!-- RM3 (classical expansion, teal) -->
  <circle cx="345" cy="294" r="7" fill="#0F766E"/>
  <text x="345" y="277" text-anchor="middle" font-size="10.5" fill="#0F766E">+RM3</text>

  <!-- GloVe (classical expansion, teal) -->
  <circle cx="373" cy="310" r="7" fill="#0F766E"/>
  <text x="373" y="333" text-anchor="middle" font-size="10.5" fill="#0F766E">+GloVe QE</text>

  <!-- BiEnc@100 (neural rerank, indigo, on frontier) -->
  <circle cx="325" cy="171" r="7.5" fill="#4F46E5"/>
  <text x="325" y="156" text-anchor="middle" font-size="11" fill="#4F46E5" font-weight="600">+BiEncoder</text>

  <!-- BiEnc@1000 (neural rerank, indigo, dominated) -->
  <circle cx="531" cy="156" r="7" fill="#4F46E5" fill-opacity="0.55"/>
  <text x="531" y="141" text-anchor="middle" font-size="10.5" fill="#4F46E5">+BiEnc @1000</text>

  <!-- CE@100 (neural rerank, indigo, on frontier, best) -->
  <circle cx="452" cy="138" r="8.5" fill="#4F46E5" stroke="#1B2430" stroke-width="1.5"/>
  <text x="452" y="121" text-anchor="middle" font-size="11.5" fill="#1B2430" font-weight="700">+Cross-encoder</text>

  <!-- Legend -->
  <g font-size="11.5">
    <circle cx="480" cy="490" r="6" fill="#1B2430"/>
    <text x="494" y="494" fill="#1B2430">Baseline</text>

    <circle cx="480" cy="512" r="6" fill="#0F766E"/>
    <text x="494" y="516" fill="#1B2430">Classical query expansion</text>

    <circle cx="480" cy="534" r="6" fill="#4F46E5"/>
    <text x="494" y="538" fill="#1B2430">Neural re-ranking</text>
  </g>
  </g>
</svg>
